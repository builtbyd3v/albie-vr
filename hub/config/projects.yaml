# project_id -> repo the pet can read (qa) or edit on a pet/* branch (code).
# Paths are expanded (~) server-side and never sent to clients.
projects:
  # The headset's default project id (unity PetConfig.projectId) is still "gatorhack": keep this key until that is
  # renamed. It points at Albie's sandbox and edits in place, the same as "sandbox" below.
  gatorhack:
    path: "~/Documents/GitHub/albie-sandbox"
    default_mode: "auto"
    edit_in_place: true
  # Albie's sandbox (sandbox/setup.sh): voice edits land here, straight on its main branch.
  # Use it with DEFAULT_PROJECT=sandbox (setup.sh prints the hub/.env lines).
  sandbox:
    path: "~/Documents/GitHub/albie-sandbox"
    default_mode: "auto"
    edit_in_place: true
