# Albie cloud on Fly.io. Deploy: cloud-py/deploy.sh. Price (docs.fly.io/about/pricing, iad, 2026-10-28): shared-cpu-2x
# 2 GB = $13.39/month always on, billed per second; no volume (device state is on the machine's disk and resets on a
# redeploy); outbound $0.02/GB. Measured: server 0.3 GB + CAD worker 0.65 GB + one training run 0.37 GB.
app = "albie-cad"
primary_region = "iad"
swap_size_mb = 1024  # brief spikes (a CAD export while a run trains) swap instead of being killed

[build]
  dockerfile = "cloud-py/Dockerfile"

[env]
  CAD_WORKERS = "1"
  MAX_TRAINING = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"  # always on: the first judge never waits for a cold start
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
